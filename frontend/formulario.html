<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de adicionar equipamento</title>
    <link rel = "stylesheet" href = "styles.css">
    <script src = "script.js" defer></script>
    <script >

    </script>
</head>
<body class = "estilo-background">
    <button class = "botao_retorno" onclick= "window.location.href = 'index.html'">
        <span class = "seta">
            &#8592;
        </span>
        <span class = "texto_voltar">
            Voltar
        </span>
    </button>
    
    <div class = "titulo_formulario">
        <h1>Novo equipamento</h1>
    </div>
    <div class = "forms_conteiner">
        

        <div class = "forms-lado lado-esquerdo-forms">
            <h2 class = "estilo_titulo_forms">
                Nome do equipamento
            </h2>
            <input type = "text" placeholder="Nome equipamento" class = "estilo_campo_texto">                

            
           <div class="conteiner-selecao">
                <div class="estilo_titulo_forms">
                    <h2>Escolha um cômodo:</h2>
                </div>
            <select id="comodos" class="estilo_campo_texto">
            <option value="" disabled selected>
                Selecione um cômodo...
            </option>
            <option value="quartos">Quartos</option>
            <option value="sala">Sala</option>
            <option value="cozinha">Cozinha</option>
            <option value="banheiro">Banheiro</option>
            <option value="area_servico">Área de Serviços</option>
        </select>
</div>
            
        </div>

        <div class = "forms-lado lado-direito-forms">
            <div class = "estilo_titulo_forms">
                <h2>
                    Descrição do equipamento
                </h2>
            </div>
            <textarea placeholder="Nome equipamento" class = "estilo_campo_texto_descricao">

            </textarea>

            
                <h2 class = "estilo_titulo_forms">
                    Expectativa de consumo
                </h2>
                <input type = "text" placeholder="Expectativa de Consumo" class = "estilo_campo_texto">
            
            <button class = "estilo_titulo_forms_2">
                <h2>
                    Salvar
                </h2>
            </button> 
        

       

        </div>
        
    </div>
    
    
</body>
</html>
